<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#252a8e"><meta name="description" content="Galeria de hospedagens do Clube Viajar Mais"><title>La Torre Resort | Fotos • Clube Viajar Mais</title><style>
:root{--blue:#252a8e;--orange:#ff6900;--muted:#697386}*{box-sizing:border-box}body{margin:0;background:#fff;color:#18223a;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{border-bottom:1px solid #e9edf5;background:white}.head{max-width:1130px;margin:auto;display:flex;justify-content:center;padding:18px 22px}.logo{width:min(330px,85vw);height:auto;display:block;mix-blend-mode:multiply}main{max-width:1130px;margin:auto;padding:36px 22px 70px}.eyebrow{display:table;margin:0 auto 15px;border-radius:30px;background:var(--blue);color:white;padding:10px 29px;font-size:15px;font-weight:800;letter-spacing:1px;box-shadow:0 6px 18px #252a8e29}h1{text-align:center;color:var(--blue);font-size:clamp(34px,5vw,56px);margin:8px 0 5px;letter-spacing:-1.6px}.place{text-align:center;color:var(--muted);font-size:19px;margin:0 0 27px}.notice{max-width:790px;margin:0 auto 30px;text-align:center;border:1px solid #ffdfbd;background:#fff9f1;color:#815010;padding:12px 18px;border-radius:13px;font-size:14px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.tile{position:relative;cursor:pointer;padding:0;border:0;border-radius:18px;overflow:hidden;background:#e7f2ff;aspect-ratio:1.25;box-shadow:0 6px 22px #1c326012;transition:transform .2s,box-shadow .2s}.tile:first-child{grid-column:span 3;aspect-ratio:2.4}.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 12px 28px #1c326029;outline:3px solid #ff69004d}.tile img{width:100%;height:100%;object-fit:cover;display:block}.tile span{position:absolute;bottom:0;left:0;right:0;padding:25px 14px 12px;text-align:left;background:linear-gradient(transparent,#142550b8);color:white;font-size:16px;font-weight:800}.tile:first-child span{font-size:22px;padding:35px 20px 18px}.footer{text-align:center;margin:48px 0 0;color:#7c8495;font-size:13px}.footer b{color:var(--blue)}.overlay{position:fixed;inset:0;z-index:10;background:rgba(5,13,35,.95);display:none;align-items:center;justify-content:center;flex-direction:column;padding:68px 16px 102px}.overlay.open{display:flex}.large{max-height:calc(100vh - 230px);max-width:min(1100px,100%);width:auto;object-fit:contain;border-radius:12px;background:#e7f2ff}.close,.arrow{border:0;background:#fff2;color:white;cursor:pointer;display:grid;place-items:center;border-radius:50%;font-size:29px}.close{position:absolute;right:23px;top:20px;width:45px;height:45px}.arrow{position:absolute;top:48%;width:52px;height:52px}.prev{left:15px}.next{right:15px}.close:hover,.arrow:hover{background:var(--orange)}.count{position:absolute;top:29px;left:50%;transform:translateX(-50%);color:white;font-weight:700}.caption{color:white;margin-top:14px;font-size:16px;font-weight:700}.thumbs{position:absolute;bottom:16px;left:12px;right:12px;display:flex;gap:8px;justify-content:center;overflow-x:auto;padding:8px}.thumb{flex:0 0 72px;width:72px;height:54px;border:2px solid transparent;border-radius:9px;overflow:hidden;background:#fff3;padding:0;cursor:pointer}.thumb.active{border-color:var(--orange)}.thumb img{width:100%;height:100%;object-fit:cover}@media(max-width:650px){main{padding:25px 13px 50px}.gallery{gap:9px;grid-template-columns:repeat(2,1fr)}.tile:first-child{grid-column:span 2;aspect-ratio:1.45}.tile{border-radius:12px;aspect-ratio:1}.tile span{font-size:13px;padding:25px 9px 9px}.place{font-size:16px}.arrow{width:39px;height:39px;font-size:22px}.prev{left:5px}.next{right:5px}.overlay{padding-left:10px;padding-right:10px}.large{max-width:100%;max-height:calc(100vh - 220px)}}
</style></head><body><header><div class="head"><img class="logo" src="/assets/logo.jpg" alt="Clube Viajar Mais"></div></header><main><div class="eyebrow">▣ FOTOS</div><h1>La Torre Resort</h1><p class="place">📍 Porto Seguro – BA</p><div class="gallery" id="gallery"></div><div class="footer"><b>Clube Viajar Mais</b> • Sua próxima viagem começa aqui!</div></main><div class="overlay" id="viewer" role="dialog" aria-modal="true" aria-label="Visualizador de fotos"><button class="close" id="close" aria-label="Fechar">×</button><div class="count" id="count"></div><button class="arrow prev" id="prev" aria-label="Foto anterior">❮</button><img class="large" id="large" alt=""><button class="arrow next" id="next" aria-label="Próxima foto">❯</button><div class="caption" id="caption"></div><div class="thumbs" id="thumbs"></div></div><script>
// Fotos da galeria oficial: https://www.resortlatorre.com.br/fotos
const photos=[{"name":"Piscinas","src":"https://storage.googleapis.com/api-booking/assets/615045e1e60433a97c69d8b5a9cda5ec-1700501216648.jpeg"},{"name":"Acomodações","src":"https://storage.googleapis.com/api-booking/assets/7d1959021e0b20da25832b36e517f4c8-1700502833080.jpeg"},{"name":"Restaurante","src":"https://storage.googleapis.com/api-booking/assets/ccdf093f275454465550eb25b725761d-1700500733199.jpeg"},{"name":"Praia do Mutá","src":"https://storage.googleapis.com/api-booking/assets/02b2f09c7b1d0e338eeb661b7cff413c-1700500193279.jpeg"},{"name":"Aventura e lazer","src":"https://storage.googleapis.com/api-booking/assets/c3aaea0d3c91d906704d6cbf757931c9-1700501826239.jpeg"},{"name":"Jardins e piscinas","src":"https://storage.googleapis.com/api-booking/assets/e3db368106abde74aba29552a17bca19-1700501359571.jpeg"},{"name":"Gastronomia","src":"https://storage.googleapis.com/api-booking/assets/3323e00343ccaabe48f7b17b7ec94107-1783438588999.webp"},{"name":"Música ao vivo","src":"https://storage.googleapis.com/api-booking/assets/ea49c2f06ba013242c8b083da64c6634-1700502306518.jpeg"},{"name":"Vista da praia","src":"https://storage.googleapis.com/api-booking/assets/4aab5698c85f6c462db5a6197d467329-1783439230070.webp"}];
let current=0;const gallery=document.getElementById('gallery'),viewer=document.getElementById('viewer'),large=document.getElementById('large'),caption=document.getElementById('caption'),count=document.getElementById('count'),thumbs=document.getElementById('thumbs');photos.forEach((p,i)=>{const b=document.createElement('button');b.className='tile';b.setAttribute('aria-label','Abrir '+p.name);b.innerHTML=`<img src="${p.src}" alt="La Torre Resort — ${p.name}" loading="lazy"><span>${p.name}</span>`;b.onclick=()=>open(i);gallery.append(b);const t=document.createElement('button');t.className='thumb';t.setAttribute('aria-label','Ver '+p.name);t.innerHTML=`<img src="${p.src}" alt="">`;t.onclick=()=>show(i);thumbs.append(t)});function show(i){current=(i+photos.length)%photos.length;large.src=photos[current].src;large.alt='La Torre Resort — '+photos[current].name;caption.textContent=photos[current].name;count.textContent=`${current+1} / ${photos.length}`;[...thumbs.children].forEach((el,j)=>el.classList.toggle('active',j===current));thumbs.children[current].scrollIntoView({block:'nearest',inline:'nearest'})}function open(i){viewer.classList.add('open');document.body.style.overflow='hidden';show(i);document.getElementById('close').focus()}function close(){viewer.classList.remove('open');document.body.style.overflow=''}document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);viewer.onclick=e=>{if(e.target===viewer)close()};document.addEventListener('keydown',e=>{if(!viewer.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
</script></body></html>
